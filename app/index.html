<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GIS Municipal - Prototipo</title>

  <!-- LIBRERIA -->
  <!--sin CSS separado -->
  <script type="module" src="https://js.arcgis.com/5.0/"></script>

  <link rel="stylesheet" href="./ui/styles.css"/>

</head>

<body>

  <div id="toolbar">
    <h1>GIS Municipal</h1>
    <calcite-button id="btn-toggle"
                    appearance="outline-fill"
                    kind="neutral">
                    3D
    </calcite-button>
  </div>

  <!-- VISTA 2D: Web Component -->
  <arcgis-map
    id="my-map"
    basemap="topo-vector"
    center="-1.6457,42.6954"
    zoom="13"
    class="visible">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
  </arcgis-map>

  <!-- VISTA 3D: Web Component -->
  <arcgis-scene
    id="my-scene"
    item-id="8244d9e565db4e448b19fb7d82e52315"
    ground="world-elevation"
    camera-tilt="60">
    <arcgis-zoom slot="top-left"> </arcgis-zoom>
    <arcgis-navigation-toggle slot="top-left"> </arcgis-navigation-toggle>
    <arcgis-compass slot="top-left"> </arcgis-compass>
  </arcgis-scene>

 
<!-- PANEL -->
  <div id="panel">
    <p class="panel-label">Capas</p>
    <arcgis-layer-list 
        ID = "layer-list"    
        reference-element="my-map">
    </arcgis-layer-list>

    <p class="panel-label">Leyenda</p>
    <div id="legend"></div>
    <!-- <arcgis-legend id = "legend" reference-element="my-map"> </arcgis-legend> -->
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
