<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Geo app — Visor Adaptativo</title>

  <!--
    Script inline de detección de idioma.
    DEBE ejecutarse antes de cargar el SDK de ArcGIS para que esriConfig.locale
    esté establecido cuando el SDK inicialice sus Web Components.
    Lee: ?lang= (URL) > localStorage > fallback "es"
  -->
  <script>
    (function () {
      const stored = localStorage.getItem("geo-app-lang");
      const urlLang = new URLSearchParams(location.search).get("lang");
      const lang = urlLang || stored || "es";
      window.__GIS_LANG__ = lang;
      window.esriConfig = window.esriConfig || {};
      window.esriConfig.locale = lang;
    })();
  </script>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!--
    calcite-shell: contenedor raíz de toda la app.
    content-behind: el mapa ocupa todo el viewport incluyendo
    el área bajo los paneles laterales — los paneles flotan encima.
    Sin este atributo, el shell reserva espacio lateral para los paneles
    y el mapa se encoge cuando se abren.
  -->
  <calcite-shell content-behind>

    <!-- ═══ CABECERA ══════════════════════════════════════════════════════ -->
    <calcite-navigation slot="header">

      <calcite-navigation-logo
        slot="logo"
        icon="map-pin"
        data-i18n-props='{"heading":"app.title","description":"app.description"}'
      ></calcite-navigation-logo>

      <div slot="content-center" id="municipio-selector-container"></div>

      <div slot="content-end" id="lang-selector-container"></div>

    </calcite-navigation>

    <!-- ═══ PANEL LATERAL ════════════════════════════════════════════════
      Patrón oficial Calcite para apps GIS:
      - calcite-shell-panel con display-mode="float" flota sobre el mapa
        sin empujarlo ni reservar espacio lateral.
      - El action-bar va en slot="action-bar" DENTRO del shell-panel.
        Así el panel de contenido "sale" del action-bar hacia la derecha
        al abrirse — comportamiento nativo del componente.
      - collapsed al inicio: solo se ve el action-bar (franja delgada),
        sin fondo blanco. El panel de contenido está cerrado (closed).
      - Al hacer clic en una acción: collapsed=false + panel.closed=false
        → el panel aparece a la derecha del action-bar.
      - Al cerrar con X: panel.closed=true + collapsed=true.
    ═════════════════════════════════════════════════════════════════════ -->
    <calcite-shell-panel
      slot="panel-start"
      display-mode="float-all"
      id="shell-panel-start"
      collapsed
      width-scale="m"
    >

      <!--
        calcite-action-bar en su slot correcto dentro del shell-panel.
        Con esto el panel de capas "emerge" del action-bar al abrirse.
        overflow-actions-disabled: evita que las acciones se colapsen
        en un menú desbordante — preferimos scroll vertical.
        El botón de expandir/colapsar texto es nativo del componente.
      -->
      <calcite-action-bar
        slot="action-bar"
        id="main-action-bar"
        overflow-actions-disabled
        expand-disabled
      >
        <!-- <calcite-tooltip slot="expand-tooltip">Expandir / Colapsar</calcite-tooltip> -->

        <calcite-action-group>

          <calcite-action
            id="action-capas"
            icon="layers"
            text="Capas"
            data-i18n-props='{"text":"action.capas","title":"action.capas","label":"action.capas"}'
            data-panel="panel-capas"
          ></calcite-action>        

        
        </calcite-action-group>

      </calcite-action-bar>

      <!--
        Panel de contenido: hermano del action-bar dentro del shell-panel.
        closed al inicio — se abre desde actionBar.js al hacer clic en
        el icono de capas.

        para mostrar X de cerrar panel añadir

        data-i18n-props='{"heading":"panel.capas.heading"}'
        closable
        
      -->
      <calcite-panel
        id="panel-capas"
        closed
      >

        <calcite-block
          data-i18n="panel.basemap.heading"
          data-i18n-attr="heading"
          collapsible
          collapsed
        >
          <div id="basemap-selector-container"></div>
        </calcite-block>

        <calcite-block
          id="capas-block"
          heading="Cargando..."
          data-i18n="panel.capas.heading"
          data-i18n-attr="heading"
          collapsible
          collapsed
        >
          <div id="layer-tree-container"></div>
        </calcite-block>

      </calcite-panel>

    </calcite-shell-panel>

    <!-- ═══ ÁREA CENTRAL: MAPA ════════════════════════════════════════════
      position:fixed en CSS para que los slots bottom-* del SDK
      queden anclados al viewport y no sean recortados por el shell.
    ═════════════════════════════════════════════════════════════════════ -->
    <div id="map-container">

      <!-- Vista 2D — activa por defecto -->
      <arcgis-map id="map-view" class="vista-activa">
        <arcgis-zoom             slot="top-right"></arcgis-zoom>
        <arcgis-home             slot="top-right"></arcgis-home>
        <arcgis-compass slot="top-right"></arcgis-compass>
        <arcgis-locate  slot="top-right"></arcgis-locate>

        <!-- Toggle en slot="top-right" → el SDK lo apila debajo del locate -->
        <calcite-button
          id="btn-toggle-vista"
          slot="top-right"
          icon-start="3d"
          appearance="outline-fill"
          kind="neutral"
          scale="m"
          label="Alternar 2D/3D"
          title="Alternar 2D/3D"
        ></calcite-button>

        <arcgis-popup></arcgis-popup>
        <arcgis-scale-bar        slot="bottom-left" unit="metric"></arcgis-scale-bar>
      </arcgis-map>

      <!-- Vista 3D — oculta al inicio -->
      <arcgis-scene id="scene-view" class="vista-inactiva">
        <arcgis-zoom              slot="top-right"></arcgis-zoom>
        <arcgis-home              slot="top-right"></arcgis-home>
        <arcgis-compass slot="top-right"></arcgis-compass>
        <arcgis-locate  slot="top-right"></arcgis-locate>

        <!-- Mismo botón de la vista 2d — apunta al mismo id, queda solo uno activo -->
        <calcite-button
          id="btn-toggle-vista-scene"
          slot="top-right"
          icon-start="2d"
          appearance="outline-fill"
          kind="neutral"
          scale="m"
          label="Alternar 2D/3D"
          title="Alternar 2D/3D"
        ></calcite-button>
        
        <arcgis-popup></arcgis-popup>
        <arcgis-navigation-toggle slot="top-right"></arcgis-navigation-toggle>
        <arcgis-scale-bar         slot="bottom-left" unit="metric"></arcgis-scale-bar>
      </arcgis-scene>

      <!--
        Leyenda flotante arrastrable.
        legendPanel.js monta el <arcgis-legend> en #legend-container.
        actionBar.js gestiona visibilidad y drag.
        Oculto por defecto con clase .hidden.
      -->
      <div id="legend-float-container" class="legend-float hidden">
        <div class="legend-float-header">
          <span
            class="legend-float-title legend-drag-handle"
            data-i18n="panel.legend.heading"
          ></span>
          <calcite-action
            id="legend-float-close"
            icon="x"
            scale="s"
            appearance="transparent"
          ></calcite-action>
        </div>
        <div id="legend-container"></div>
      </div>

      <!--
        Calcite action trigger de leyenda sobre el mapa.
        Segundo punto de entrada para abrir la leyenda flotante
      -->
      <calcite-action
        id="legend-map-trigger"
        class="legend-map-trigger"
        icon="legend-plus"
        text="Leyenda"
        data-i18n-attr="text"
        data-i18n="panel.legend.heading"
        scale="m"
      ></calcite-action>

      <!-- Coordenadas flotantes -->
    
      <arcgis-coordinate-conversion
          reference-element="map-view"         
          mode="live"
          orientation="auto"
          hide-settings-button
          hide-input-button
        ></arcgis-coordinate-conversion>      

       <!-- ═══ HERRAMIENTAS ══════════════════════════════════════════════════
        El action-bar interno y los widgets se construyen dinámicamente en
        ui/toolPanel.js a partir de DEPLOYMENT.herramientas. Aquí solo vive
        el ancla fija: el expand-trigger y su action-bar vacío.
        Motivo: igual que layerTree.js construye el árbol en JS a partir del
        catálogo, este panel no puede tener HTML fijo — su contenido varía
        por cliente.
      ═══════════════════════════════════════════════════════════════════ -->
      <arcgis-expand
        id="tools-expand"
        class="tools-expand"
        expand-icon="wrench"
        collapsed-icon="wrench"
        mode="floating"
        data-i18n-attr="expand-tooltip"
        data-i18n="tools.panel.heading"
      >
        <calcite-action-bar
          id="tools-action-bar"
          layout="horizontal"
          overflow-actions-disabled
          expand-disabled
        ></calcite-action-bar>
      </arcgis-expand>

       <!-- Portal de paneles de herramientas — mismo nivel que legend-float-container,
       mismo motivo: hereda el escape de overflow de #map-container (decisión 15.07.26).
       No necesita estar fuera de calcite-shell. -->
      <div id="tools-widgets-portal"></div>

    </div>

    <!-- ═══ BANNER DE ERROR ═══════════════════════════════════════════════ -->
    <div id="app-error" class="hidden app-error-banner" role="alert"></div>

  </calcite-shell>



  <script type="module" src="./main.js"></script>

</body>
</html>
