<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Geo app — Visor Adaptativo</title>

  <!--
    Script inline de detección de idioma.
    DEBE ejecutarse antes de cargar el SDK de ArcGIS para que esriConfig.locale
    esté establecido cuando el SDK inicialice sus Web Components.
    Lee: ?lang= (URL) > localStorage > fallback "es"
  -->
  <script>
    (function () {
      const stored = localStorage.getItem("geo-app-lang");
      const urlLang = new URLSearchParams(location.search).get("lang");
      const lang = urlLang || stored || "es";
      window.__GIS_LANG__ = lang;
      window.esriConfig = window.esriConfig || {};
      window.esriConfig.locale = lang;
    })();
  </script>

  <script type="module" src="https://js.arcgis.com/5.0/"></script>
  <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css" />
  <link rel="stylesheet" href="https://js.arcgis.com/calcite-components/2.13.2/calcite.css" />
  <script type="module" src="https://js.arcgis.com/calcite-components/2.13.2/calcite.esm.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <calcite-shell>

    <!-- ═══ CABECERA ══════════════════════════════════════════════════════ -->
    <calcite-navigation slot="header">

      <calcite-navigation-logo
        slot="logo"
        icon="map-pin"
        data-i18n-props='{"heading":"app.title","description":"app.description"}'
      ></calcite-navigation-logo>

      <div slot="content-center" id="municipio-selector-container"></div>

      <!--
        toolbar-container ahora solo aloja el selector de idioma.
        El toggle 2D/3D se traslada al action bar (actionBar.js).
      -->
      <div slot="user" id="lang-selector-container"></div>

    </calcite-navigation>

    <!-- ═══ ACTION BAR + PANELES LATERALES ═══════════════════════════════
      calcite-shell-panel con display-mode="float" hace que los paneles
      floten sobre el mapa sin reducir su área. El action bar vive dentro
      del shell-panel y controla qué panel está abierto.
    ════════════════════════════════════════════════════════════════════════ -->
    <calcite-shell-panel slot="panel-start" display-mode="float" id="shell-panel-start" collapsed>

      <!--
        calcite-action-bar: barra de iconos vertical en el borde izquierdo.
        expanded="false" → solo iconos, sin etiquetas de texto.
        Los calcite-action disparan "calciteActionClick" que actionBar.js escucha.
      -->
      <calcite-action-bar slot="action-bar" expanded="false" id="main-action-bar">

        <!-- Grupo principal: herramientas de exploración de datos -->
        <calcite-action-group>

          <calcite-action
            id="action-capas"
            icon="layers"
            text="Capas"
            data-i18n="action.capas"
            data-i18n-attr="text"
            data-panel="panel-capas"
          ></calcite-action>

          <calcite-action
            id="action-leyenda"
            icon="legend"
            text="Leyenda"
            data-i18n="action.leyenda"
            data-i18n-attr="text"
            data-action="toggle-leyenda"
          ></calcite-action>

               
        <calcite-action
          id="action-toggle-vista"
          icon="3d"
          text="Toggle 2D/3D"
          data-i18n="action.toggle3d"
          data-i18n-attr="text"
          data-action="toggle-vista"
        ></calcite-action>
      </calcite-action-group>

      </calcite-action-bar>

      <!-- Panel de capas — abierto/cerrado por actionBar.js -->
      <calcite-panel
        id="panel-capas"
        data-i18n-props='{"heading":"panel.capas.heading"}'
        closable
        closed
      >

        <calcite-block
          data-i18n="panel.basemap.heading"
          data-i18n-attr="heading"
          collapsible
          collapsed
        >
          <div id="basemap-selector-container"></div>
        </calcite-block>

        <calcite-block
          id="capas-block"
          heading="Cargando..." 
          data-i18n="panel.capas.heading"
          data-i18n-attr="heading"
          expanded
        >
          <div id="layer-tree-container"></div>
        </calcite-block>

      </calcite-panel>

    </calcite-shell-panel>

    <!-- ═══ ÁREA CENTRAL: MAPA ════════════════════════════════════════════ -->
    <div id="map-container">

      <!-- Vista 2D — activa por defecto -->
      <arcgis-map id="map-view" class="vista-activa">
        <arcgis-zoom             slot="top-left"></arcgis-zoom>
        <arcgis-home             slot="top-left"></arcgis-home>
        <arcgis-scale-bar        slot="bottom-left" unit="metric"></arcgis-scale-bar>
        <arcgis-coordinates-tool slot="bottom-right"></arcgis-coordinates-tool>
      </arcgis-map>

      <!-- Vista 3D — oculta al inicio -->
      <arcgis-scene id="scene-view" class="vista-inactiva">
        <arcgis-zoom              slot="top-left"></arcgis-zoom>
        <arcgis-home              slot="top-left"></arcgis-home>
        <arcgis-navigation-toggle slot="top-left"></arcgis-navigation-toggle>
        <arcgis-scale-bar         slot="bottom-left" unit="metric"></arcgis-scale-bar>
      </arcgis-scene>

      <!--
        Contenedor de la leyenda flotante.
        legendPanel.js monta el <arcgis-legend> aquí.
        Posición: esquina inferior derecha, sobre el mapa.
        Oculto por defecto; actionBar.js lo muestra/oculta.
      -->
      <div id="legend-float-container" class="legend-float hidden">
        <div class="legend-float-header">
          <span
            class="legend-float-title"
            data-i18n="panel.legend.heading"
          ></span>
          <calcite-action
            id="legend-float-close"
            icon="x"
            scale="s"
            appearance="transparent"
          ></calcite-action>
        </div>
        <div id="legend-container"></div>
      </div>

      <!--
        Trigger de leyenda sobre el mapa.
        Segundo punto de entrada: el usuario puede abrir la leyenda
        directamente desde el mapa sin pasar por el action bar.
        actionBar.js lo conecta al mismo toggle.
      -->
      <button id="legend-map-trigger" class="legend-map-trigger" data-i18n="panel.legend.heading"></button>

    </div>

    <!-- ═══ BANNER DE ERROR ═══════════════════════════════════════════════ -->
    <div id="app-error" class="hidden app-error-banner" role="alert"></div>

  </calcite-shell>

  <script type="module" src="./main.js"></script>

</body>
</html>
