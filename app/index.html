<body>

  <div id="toolbar">
    <h1>GIS Municipal</h1>
    <button id="btn-toggle-view">Cambiar a 3D</button>
  </div>

  <!-- VISTA 2D: Web Component -->
  <arcgis-map
    id="my-map"
    basemap="streets-vector"
    center="-1.6457,42.6954"
    zoom="13">
  </arcgis-map>

  <!-- VISTA 3D: Web Component -->
  <arcgis-scene
    id="my-scene"
    basemap="topo-3d"
    ground="world-elevation"
    style="display:none;">
  </arcgis-scene>

 
<!-- PANEL -->
  <div id="panel">
    <p class="panel-label">Capas</p>
    <arcgis-layer-list 
        ID = "layer-list"    
        reference-element="my-map">
    </arcgis-layer-list>

    <p class="panel-label">Leyenda</p>
        <arcgis-legend 
        id = "legend"
        reference-element="my-map">
    </arcgis-legend>
  </div>

  <script type="module" src="app.js"></script>
